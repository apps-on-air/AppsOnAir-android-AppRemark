plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.jetbrains.kotlin.android)
    id("maven-publish")
}

android {
    namespace 'com.appsonair.appremark'
    compileSdk 34
    defaultConfig {
        minSdk 24
        versionCode 1
        versionName "1.2.0"
        android {
            buildConfigField 'String', 'BASE_URL', BASE_URL
            buildConfigField 'String', 'VERSION_CODE', VERSION_CODE
            buildConfigField 'String', 'VERSION_NAME', VERSION_NAME
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        debug {
            enableUnitTestCoverage true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Robolectric decodes images through FileDescriptor internals on JDK 17+
                jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
                // count classes loaded by Robolectric's sandbox classloader in coverage
                jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.*']
                }
            }
        }
    }
    publishing {
        // Tell Android to publish the release variant
        singleVariant("release")
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.biometric
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.okhttp
    implementation libs.photoeditor
    implementation libs.powerspinner
    implementation libs.glide
    implementation libs.appsonair.android.core
    annotationProcessor libs.compiler
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.mockk
    testImplementation libs.mockwebserver
    testImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.appsonair'
                artifactId = 'appremark'
                version = '1.2.0'
            }
        }
        repositories {
            mavenLocal()
        }
    }
}